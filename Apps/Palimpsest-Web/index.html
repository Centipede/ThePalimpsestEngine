<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Palimpsest Engine</title>
    <script>
      // Resolve the theme before first paint, so a dark-mode user does not get a
      // flash of the light theme while the bundle loads.
      // NOTE: keep in sync with the resolution logic in src/stores/theme.ts.
      (function () {
        try {
          var mode = localStorage.getItem('theme');
          if (mode !== 'light' && mode !== 'dark') mode = 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.classList.toggle('sl-theme-dark', dark);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
